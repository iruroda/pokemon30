<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>30주년 로고 아이콘 갤러리</title>
<link id="favico" rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  :root {
    /* 30th 리뉴얼 팔레트(5색): 흰색/노란색/검은색/빨간색/옅은회색 */
    --p-white:#FFFFFF; --p-yellow:#FFCF0F; --p-black:#000000; --p-red:#E70011; --p-gray:#EFEFEF;
    --bg:#FFFFFF; --card:#252834; --accent:#ffcb05; --text:#000000; --sub:#8a8fa3;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
  input,textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text}
  img{-webkit-user-drag:none;user-drag:none}
  html{overscroll-behavior-y:none}
  body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow-x:hidden;overscroll-behavior-y:none}
  @media (hover:hover) and (pointer:fine){
    html{scrollbar-gutter:stable}
    #mpanel{scrollbar-gutter:stable}
    html,#mpanel{scrollbar-width:thin}
    html::-webkit-scrollbar-track,#mpanel::-webkit-scrollbar-track{background:transparent}
    html::-webkit-scrollbar-thumb,#mpanel::-webkit-scrollbar-thumb{background:transparent;border-radius:6px;transition:background .25s}
    html.scrolling::-webkit-scrollbar-thumb,#mpanel.scrolling::-webkit-scrollbar-thumb{background:rgba(232,234,240,.28)}
    html.scrolling::-webkit-scrollbar-thumb:hover,#mpanel.scrolling::-webkit-scrollbar-thumb:hover{background:rgba(232,234,240,.42)}
    html,#mpanel{scrollbar-color:transparent transparent}
    html.scrolling,#mpanel.scrolling{scrollbar-color:rgba(232,234,240,.28) transparent}
  }
  #wrap{max-width:520px;margin:0 auto;min-height:100dvh}
  #mtitle{position:sticky;top:0;z-index:2;flex:none;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;padding:16px 36px 12px 16px;background:var(--p-white)}
  #mtitle img{width:24px;height:24px}
  #topbar{position:sticky;top:0;z-index:10;background:var(--p-yellow);padding:10px 12px 8px;border-bottom:none}
  #row1{display:flex;align-items:center;gap:8px;height:34px;margin-bottom:8px;padding-right:150px}
  #progresswrap{flex:1}
  #ptextrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
  #ptext{font-size:12px;color:var(--sub);white-space:nowrap;flex:none}
  #ptext b{color:var(--accent);font-size:14px}
  #ptext .sl{font-size:12px}
  #ptext #ptotal{font-size:12px}
  #typerow{display:flex;gap:2px;flex-wrap:nowrap;justify-content:flex-end;min-width:0;overflow:hidden}
  #typerow .tic{width:12px;height:12px;flex:none;object-fit:contain;visibility:hidden}
  #pbar{height:6px;background:#3a3e50;border-radius:3px;overflow:hidden;width:100%}
  #pfill{height:100%;width:0%;background:var(--accent);border-radius:3px;transition:width .3s}
  #typerow .tic.on{visibility:visible}
  #progresswrap,#answerWrap{display:none}
  #pagetitle{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:17px;line-height:20px;font-weight:800;color:var(--p-black);padding:4px 0}
  #pagetitle .t30{color:var(--p-red)}
  #pagetitle img{width:20px;height:20px;flex:none}
  #ptitletext{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menubtn{position:fixed;top:10px;right:calc(max(0px, (100vw - 520px) / 2) + 8px);z-index:35;width:34px;height:34px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;transition:transform .35s cubic-bezier(.4,0,.2,1)}
  #menubtn span{display:block;width:19px;height:3px;border-radius:2px;background:var(--text);transform-origin:center;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .2s cubic-bezier(.4,0,.2,1)}
  #menubtn.open span:nth-child(1){transform:translateY(8px) rotate(45deg)}
  #menubtn.open span:nth-child(2){opacity:0;transform:scaleX(0)}
  #menubtn.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
  #answerWrap{position:relative}
  #answer{width:100%;background-color:var(--card);background-image:linear-gradient(to bottom,transparent,#8a8fa3 50%,transparent),linear-gradient(to bottom,transparent,#3a3e50 50%,transparent);background-repeat:no-repeat,no-repeat;background-position:center,center;background-size:100% 0%,100% 0%;border:1.5px solid #3a3e50;border-radius:12px;color:var(--text);font-size:17px;padding:11px 40px 11px 14px;outline:none}
  #answer::placeholder{color:#3a3e50;opacity:1}
  #answer::-webkit-search-cancel-button,#answer::-webkit-search-decoration{-webkit-appearance:none;display:none}
  #answer{-webkit-appearance:none;appearance:none}
  #answer:focus{border-color:var(--accent)}
  #answer.correct{animation:wave .9s ease}
  #answerClearBtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  #answerClearBtn:active{opacity:.55}
  #answerClearBtn span{position:absolute;width:14px;height:2px;border-radius:1px;background:var(--sub)}
  #answerClearBtn span:nth-child(1){transform:rotate(45deg)}
  #answerClearBtn span:nth-child(2){transform:rotate(-45deg)}
  @keyframes wave{0%{background-size:100% 0%,100% 0%}38%{background-size:100% 200%,100% 0%}58%{background-size:100% 0%,100% 200%}100%{background-size:100% 0%,100% 0%}}
  .shead{font-size:14px;font-weight:700;color:var(--accent);padding:16px 12px 6px;display:flex;justify-content:space-between;align-items:baseline}
  .shead small{color:var(--sub);font-weight:400;font-size:11px}
  .dexver{margin-left:8px;display:inline-flex;gap:4px;vertical-align:1px}
  .dvbtn{background:var(--card);border:1px solid #3a3e50;color:var(--sub);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:400;cursor:pointer;line-height:1.3}
  .dvbtn.on{border-color:var(--accent);color:var(--accent);font-weight:700}
  .novar{margin:18px 14px;padding:14px 12px;border:2px solid #b3122a;background:#ffd9e4;color:#b3122a;border-radius:10px;font-size:13px;font-weight:600;text-align:center;line-height:1.5}
  .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 10px}
  .cell{position:relative;text-align:center}
  .cell img{display:block;width:100%;height:auto;object-fit:contain;image-rendering:pixelated;pointer-events:none;-webkit-user-drag:none}
  #wrap[data-cols="1"] .sgrid{grid-template-columns:repeat(1,1fr);gap:14px;padding:0 10px}
  #pad{height:24px}
  #menu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;opacity:0;visibility:hidden;transition:opacity .18s ease,visibility 0s linear .18s}
  #menu.on{opacity:1;visibility:visible;transition:opacity .18s ease}
  #mpanel{position:fixed;top:0;right:calc(max(0px, (100vw - 520px) / 2));width:min(320px,88vw);height:100%;background:var(--p-white);padding:0;overflow-y:auto;display:flex;flex-direction:column;overscroll-behavior:contain;z-index:21;opacity:0;visibility:hidden;transform:scale(.96);transform-origin:top right;transition:opacity .15s ease,transform .15s ease,visibility 0s linear .15s}
  #mpanel.on{opacity:1;visibility:visible;transform:scale(1);transition:opacity .15s ease,transform .15s ease}
  #mbody{padding:0 16px 28px}
  .mgroup{margin-top:22px}
  #mbody .mgroup:first-child{margin-top:2px}
  .mgtitle{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--p-black)}
  .mgtitle::after{content:"";flex:1;height:1px;background:rgba(0,0,0,.12)}
  .msec h3{font-size:12px;color:var(--sub);margin:18px 0 8px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;-webkit-user-select:none}
  .mgroup .msec:first-of-type h3{margin-top:10px}
  .msec h3 .car{font-size:10px;color:var(--sub);transition:transform .2s}
  .msec.collapsed h3{margin-bottom:0}
  .msec.collapsed .car{transform:rotate(-90deg)}
  .msec.collapsed .chips{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--p-white);border:1.5px solid rgba(0,0,0,.2);color:var(--p-black);border-radius:16px;padding:6px 12px;font-size:12px;cursor:pointer}
  .chip.on{background:var(--p-yellow);border-color:var(--p-yellow);color:var(--p-black)}
  .mbig{width:100%;background:var(--p-white);border:1.5px solid rgba(0,0,0,.2);color:var(--p-black);border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin:14px 0 0}
  .mbig.warn{color:var(--p-red);border-color:var(--p-red)}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:30;align-items:center;justify-content:center;padding:24px}
  #overlay .box{background:var(--card);border-radius:20px;padding:32px 28px;text-align:center;max-width:320px;width:100%}
  #overlay h2{color:var(--accent);font-size:22px;margin-bottom:12px}
  #overlay p{font-size:15px;line-height:1.6}
  #overlay button{margin-top:20px;background:var(--accent);border:none;border-radius:12px;padding:12px 28px;font-size:15px;font-weight:700;color:#1a1c24;cursor:pointer}
  #disclaimer{font-size:7.5px;line-height:1.5;color:var(--sub);text-align:center;margin:10px auto 0;padding:0 16px;opacity:.6}
  #greetmsg{display:none;margin:18px 0 0;font-size:13px;font-weight:600;color:var(--text)}
  #greetmsg.show{display:block}
  #greetmsg.hint{font-weight:500;color:var(--sub)}
  #greetmsg.show + .mrow{margin-top:8px}
  .mrow{display:flex;gap:8px;margin-top:18px}
  .mrow + .mrow{margin-top:8px}
  .mrow .mbig{margin:0;flex:1;height:38px;padding:0 10px;font-size:12px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:40;align-items:center;justify-content:center;padding:24px}
  .modal .box{background:var(--p-white);border-radius:20px;padding:28px 24px;text-align:center;max-width:320px;width:100%}
  .modal h2{color:var(--p-red);font-size:18px;margin-bottom:14px}
  .modal input{width:100%;box-sizing:border-box;background:var(--p-white);border:1.5px solid rgba(0,0,0,.2);border-radius:10px;color:var(--text);font-size:15px;padding:10px 12px;margin-bottom:10px;outline:none}
  .modal input:focus{border-color:var(--p-red)}
  .modal p{font-size:14px;color:var(--text);line-height:1.55;margin:0 0 18px}
  #confirmMsg.danger{color:#d98a9a}
  .modal button{margin-top:6px;background:var(--p-yellow);border:none;border-radius:12px;padding:10px 24px;font-size:14px;font-weight:700;color:var(--p-black);cursor:pointer;width:100%}
  .modal button.secondary{background:var(--p-white);border:1.5px solid rgba(0,0,0,.2);color:var(--p-black);margin-top:8px}
  #gachaStage{display:none;position:relative;width:120px;height:120px;margin:4px auto 18px}
  #gachaShadow{position:absolute;left:50%;top:90px;width:42px;height:11px;background:#A19E9E;border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(0);transform-origin:center;pointer-events:none}
  #gachaShadow.grow{transition:opacity .55s ease,transform .55s cubic-bezier(.34,1.15,.64,1);opacity:1;transform:translate(-50%,-50%) scale(1)}
  #gachaShadow.grow.condense{transition:transform .5s cubic-bezier(.36,.07,.4,1);transform:translate(-50%,-50%) scale(.9)}
  #gachaShadow.grow.condense.fadeout{transition:opacity .65s ease,transform .5s cubic-bezier(.36,.07,.4,1);opacity:0}
  #gachaBallWrap{position:absolute;inset:0;opacity:0;transform:translateY(-35px);cursor:pointer}
  #gachaBallWrap.drop{animation:gachaDrop .55s cubic-bezier(.34,1.15,.64,1) forwards}
  #gachaBallWrap.settled{opacity:1;transform:translateY(0)}
  #gachaBallWrap.settled.opening{transition:opacity .15s ease;opacity:0}
  #gachaBall,#gachaBallWhite{position:absolute;width:60px;height:60px;top:50%;left:50%;margin:-30px 0 0 -30px;object-fit:contain;transform-origin:50% 82%}
  #gachaBall.wiggle{animation:gachaWiggle .5s ease-in-out}
  #gachaBall.condense,#gachaBallWhite.condense{transform-origin:50% 100%;animation:gachaCondense .5s cubic-bezier(.36,.07,.4,1) forwards}
  #gachaBallWhite{filter:brightness(0) invert(1);opacity:0;pointer-events:none}
  #gachaBallWrap.closing #gachaBall{transition:opacity .4s ease;opacity:0}
  #gachaBallWrap.closing #gachaBallWhite{transition:opacity .4s ease;opacity:1}
  #gachaResult,#gachaResultWhite{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.15);pointer-events:none}
  #gachaResultWhite{filter:brightness(0) invert(1)}
  #gachaResult.reveal,#gachaResultWhite.reveal{transition:transform .5s cubic-bezier(.34,1.4,.64,1),opacity .15s ease;opacity:1;transform:scale(1)}
  #gachaResultWhite.reveal.flashoff{transition:opacity .18s ease;opacity:0}
  @keyframes gachaDrop{0%{opacity:0;transform:translateY(-35px)}55%{opacity:1}100%{opacity:1;transform:translateY(0)}}
  @keyframes gachaWiggle{0%,100%{transform:rotate(0deg)}20%{transform:rotate(-10deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
  @keyframes gachaCondense{
    0%{transform:scale(1) translate(0,0)}
    12%{transform:scale(.9925) translate(-2.5px,1.5px)}
    24%{transform:scale(.9825) translate(2.5px,-1.5px)}
    36%{transform:scale(.9725) translate(-2px,-2px)}
    48%{transform:scale(.965) translate(2px,1.5px)}
    60%{transform:scale(.959) translate(-1.5px,1.5px)}
    72%{transform:scale(.955) translate(1.5px,-1px)}
    84%{transform:scale(.9525) translate(-1px,1px)}
    92%{transform:scale(.951) translate(.6px,-.6px)}
    100%{transform:scale(.95) translate(0,0)}
  }
  #gachaGrid{display:none;grid-template-columns:repeat(3,1fr);gap:8px;max-height:280px;overflow-y:auto;margin:4px 0 18px;padding:2px}
  .gStage{position:relative;width:100%;aspect-ratio:1/1;--gs:86px}
  .gShadow{position:absolute;left:50%;top:calc(var(--gs) * .75);width:calc(var(--gs) * .35);height:calc(var(--gs) * .092);background:#A19E9E;border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(0);transform-origin:center;pointer-events:none}
  .gShadow.grow{transition:opacity .55s ease,transform .55s cubic-bezier(.34,1.15,.64,1);opacity:1;transform:translate(-50%,-50%) scale(1)}
  .gShadow.grow.condense{transition:transform .5s cubic-bezier(.36,.07,.4,1);transform:translate(-50%,-50%) scale(.9)}
  .gShadow.grow.condense.fadeout{transition:opacity .65s ease,transform .5s cubic-bezier(.36,.07,.4,1);opacity:0}
  .gBallWrap{position:absolute;inset:0;opacity:0;transform:translateY(calc(var(--gs) * -.292));cursor:pointer}
  .gBallWrap.drop{animation:gGridDrop .55s cubic-bezier(.34,1.15,.64,1) forwards}
  .gBallWrap.settled{opacity:1;transform:translateY(0)}
  .gBallWrap.settled.opening{transition:opacity .15s ease;opacity:0}
  .gBall,.gBallWhite{position:absolute;width:calc(var(--gs) * .5);height:calc(var(--gs) * .5);top:50%;left:50%;margin:calc(var(--gs) * -.25) 0 0 calc(var(--gs) * -.25);object-fit:contain;transform-origin:50% 82%}
  .gBall.wiggle{animation:gachaWiggle .5s ease-in-out}
  .gBall.condense,.gBallWhite.condense{transform-origin:50% 100%;animation:gGridCondense .5s cubic-bezier(.36,.07,.4,1) forwards}
  .gBallWhite{filter:brightness(0) invert(1);opacity:0;pointer-events:none}
  .gBallWrap.closing .gBall{transition:opacity .4s ease;opacity:0}
  .gBallWrap.closing .gBallWhite{transition:opacity .4s ease;opacity:1}
  .gResult,.gResultWhite{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.15);pointer-events:none}
  .gResultWhite{filter:brightness(0) invert(1)}
  .gResult.reveal,.gResultWhite.reveal{transition:transform .5s cubic-bezier(.34,1.4,.64,1),opacity .15s ease;opacity:1;transform:scale(1)}
  .gResultWhite.reveal.flashoff{transition:opacity .18s ease;opacity:0}
  @keyframes gGridDrop{0%{opacity:0;transform:translateY(calc(var(--gs) * -.292))}55%{opacity:1}100%{opacity:1;transform:translateY(0)}}
  @keyframes gGridCondense{
    0%{transform:scale(1) translate(0,0)}
    12%{transform:scale(.9925) translate(calc(var(--gs) * -.0208),calc(var(--gs) * .0125))}
    24%{transform:scale(.9825) translate(calc(var(--gs) * .0208),calc(var(--gs) * -.0125))}
    36%{transform:scale(.9725) translate(calc(var(--gs) * -.0167),calc(var(--gs) * -.0167))}
    48%{transform:scale(.965) translate(calc(var(--gs) * .0167),calc(var(--gs) * .0125))}
    60%{transform:scale(.959) translate(calc(var(--gs) * -.0125),calc(var(--gs) * .0125))}
    72%{transform:scale(.955) translate(calc(var(--gs) * .0125),calc(var(--gs) * -.0083))}
    84%{transform:scale(.9525) translate(calc(var(--gs) * -.0083),calc(var(--gs) * .0083))}
    92%{transform:scale(.951) translate(calc(var(--gs) * .005),calc(var(--gs) * -.005))}
    100%{transform:scale(.95) translate(0,0)}
  }
  @keyframes p30cellSpin{0%{transform:scaleX(1)}50%{transform:scaleX(.06)}100%{transform:scaleX(1)}}
  .cell img.spin30{animation:p30cellSpin .6s ease-in-out}
  #iconModal .box{max-width:380px}
  #iconPopImg{width:140px;height:140px;object-fit:contain;margin:0 auto 10px;display:block}
  #iconPopNameRow{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px}
  #iconPopName{font-size:16px;font-weight:800;color:var(--p-black);white-space:nowrap}
  #iconPopFav{width:30px;height:30px;flex:none;background:var(--p-white);border:1.5px solid rgba(0,0,0,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;margin:0}
  #iconPopFav svg{width:18px;height:18px;display:block}
  #iconPopFav svg path{fill:none;stroke:#000;stroke-width:1.5;stroke-linejoin:round}
  #iconPopFav.on svg path{fill:var(--p-yellow);stroke:var(--p-yellow)}
  .confirmBtns{display:flex;gap:10px}
  .confirmBtns button{width:auto;flex:1;margin-top:0;border:1.5px solid transparent}
  .confirmBtns button.secondary{margin-top:0;border-color:#3a3e50}
  #confirmOk.hold{position:relative;overflow:hidden;background:transparent;color:var(--sub);border-color:#3a3e50;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;touch-action:none}
  #confirmOk.hold .lbl{position:relative;z-index:1}
  #confirmOk.hold::before{content:"";position:absolute;inset:0;width:0;background:var(--accent)}
  #confirmOk.hold.filling::before{width:100%;transition:width 3s linear}
  #confirmOk.hold.filling{color:#1a1c24}
  #recordList{max-height:50vh;overflow-y:auto;text-align:left;font-size:12px;color:var(--text);margin:0 0 10px}
  #recordList .rec{padding:8px 4px;border-bottom:1px solid #3a3e50}
  #recordList .rec .t{color:var(--accent);font-weight:700;font-size:12px}
  #recordList .rec .s{color:var(--sub);font-size:11px;margin-top:2px}
  #recordList .empty{color:var(--sub);padding:16px 0;text-align:center}

  #toolicons{position:fixed;top:10px;right:calc(max(0px, (100vw - 520px) / 2) + 50px);z-index:35;display:flex;align-items:center;gap:2px;transition:opacity .15s ease}
  #toolicons.hide{opacity:0;pointer-events:none}
  #toolicons .ticon{width:34px;height:34px;background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #toolicons .ticon svg,#toolicons .ticon img{width:26px;height:26px;display:block}
  #searchBar{max-height:0;overflow:hidden;transition:max-height .3s ease}
  #wrap.searchOpen #searchBar{max-height:60px}
  #searchInputWrap{position:relative;margin-top:8px}
  #searchBar input{width:100%;box-sizing:border-box;background:var(--p-white);border:none;border-radius:12px;color:var(--text);font-size:15px;padding:10px 36px 10px 12px;outline:none}
  #searchClearBtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  #searchClearBtn:active{opacity:.55}
  #searchClearBtn span{position:absolute;width:14px;height:2px;border-radius:1px;background:var(--p-black)}
  #searchClearBtn span:nth-child(1){transform:rotate(45deg)}
  #searchClearBtn span:nth-child(2){transform:rotate(-45deg)}
  .mydesignAdd{position:relative;overflow:hidden;margin:14px 10px;height:64px;background:var(--p-gray);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .mdPlusBadge{width:34px;height:34px;border-radius:50%;background:var(--p-white);display:flex;align-items:center;justify-content:center;transition:opacity .18s ease,transform .18s ease;box-shadow:0 1px 3px rgba(0,0,0,.12)}

// 레전드 아르세우스 신규 종(899~905)은 8세대(galar) 박스로 병합함.
function img30Box(dex){
  if(dex===808||dex===809)return 8;
  for(var i=0;i<IMG30_RANGES.length;i++){var r=IMG30_RANGES[i];if(dex>=r[0]&&dex<=r[1])return r[2];}
  return 0;
}

  var m=/30th_(\d{4})_(\d{2})\.png$/.exec(p);
  var dex=m?+m[1]:0,form=m?+m[2]:1;
  return {path:p,idx:i,dex:dex,form:form,box:img30Box(dex),key:dex*100+form};
});

// coin30earned는 다른 페이지가 코인을 지급할 때 올리는 값이라 이 페이지에서는 절대 쓰지 않고 읽기만 함.
var coin30=0, coin30earned=0;
try{
  var _c30=JSON.parse(localStorage.getItem("p30coin30cache")||"null");
  if(_c30&&typeof _c30==="object"){
    if(typeof _c30.coin30==="number"&&isFinite(_c30.coin30)&&_c30.coin30>=0)coin30=Math.floor(_c30.coin30);
    if(typeof _c30.coin30earned==="number"&&isFinite(_c30.coin30earned)&&_c30.coin30earned>=0)coin30earned=Math.floor(_c30.coin30earned);
  }
}catch(e){}
function cacheCoin30(){localStorage.setItem("p30coin30cache",JSON.stringify({coin30:coin30,coin30earned:coin30earned}));}
function spendCoin30(n){
  n=Math.floor(n||0);
  if(n<=0||coin30<n)return false;
  coin30-=n;cacheCoin30();pushToServer();
  return true;
}
function saveP30ImgFound(){localStorage.setItem("p30imgfound",JSON.stringify(Array.from(p30ImgFound)));pushToServer();}

function p30Name(m){
  var base=NAMES[m.dex-1]||"";
  var fn=FORMNAMES[m.key];
  return fn?(base+"("+fn+")"):base;
}
var p30Favs;
try{
  var _savedFavs=JSON.parse(localStorage.getItem("p30favs")||"null");
  p30Favs=Array.isArray(_savedFavs)?new Set(_savedFavs):new Set();
}catch(e){p30Favs=new Set();}
function saveP30Favs(){localStorage.setItem("p30favs",JSON.stringify(Array.from(p30Favs)));pushToServer();}
function toggleP30Fav(key){
  if(p30Favs.has(key))p30Favs.delete(key);else p30Favs.add(key);
  saveP30Favs();
  return p30Favs.has(key);
}
var iconPopCur=null;
function fmtKB(bytes){return (bytes/1024).toFixed(1)+"KB";}
function openIconPopup(m){
  iconPopCur=m;
  $("iconPopImg").src=m.path;
  $("iconPopName").textContent=p30Name(m);
  $("iconPopFav").classList.toggle("on",p30Favs.has(m.key));
  $("iconModal").style.display="flex";
  $("iconPopSave").textContent="다운로드";
  fetch(m.path).then(function(r){return r.blob()}).then(function(blob){
    if(iconPopCur===m)$("iconPopSave").textContent="다운로드 ("+fmtKB(blob.size)+")";
  }).catch(function(){});
}
function closeIconPopup(){$("iconModal").style.display="none";iconPopCur=null;}
$("iconPopFav").onclick=function(){
  if(!iconPopCur)return;
  var on=toggleP30Fav(iconPopCur.key);
  $("iconPopFav").classList.toggle("on",on);
};
$("iconPopSave").onclick=function(){
  if(!iconPopCur)return;
  var a=document.createElement("a");
  a.href=iconPopCur.path;
  a.download=(p30Name(iconPopCur)||"logo")+".png";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
};
$("iconPopClose").onclick=closeIconPopup;
$("iconModal").onclick=function(e){if(e.target===$("iconModal"))closeIconPopup();};
function makeCell30(m){
  var cell=document.createElement("div");cell.className="cell done";
  var img=document.createElement("img");img.loading="lazy";img.alt="";img.src=m.path;
  cell.appendChild(img);
  cell._m=m;
  cell.addEventListener("click",function(){openIconPopup(m)});
  allCells.push(cell);
  return cell;
}
var p30SpinTimer=null;
(function scheduleP30Spin(){
  p30SpinTimer=setTimeout(function(){
    if(cfg.mode!=="my"&&allCells.length){
      var c=allCells[Math.floor(Math.random()*allCells.length)];
      var img=c.querySelector("img");
      if(img){
        img.classList.remove("spin30");
        void img.offsetWidth;
        img.classList.add("spin30");
      }
    }
    scheduleP30Spin();
  },4000+Math.random()*7000);
})();

function mdAcquiredList(){return IMG30META.filter(function(m){return p30ImgFound.has(m.key)});}
function mdMetaByKey(key){
  for(var i=0;i<IMG30META.length;i++){if(IMG30META[i].key===key)return IMG30META[i];}
  return null;
}
function buildShapeGrid(type,cellBuilder){
  var sh=MD_SHAPES[type];
  var g=document.createElement("div");
  g.className="mdShapeGrid t"+type;
  g.style.gridTemplateColumns=sh.cols;
  g.style.gridTemplateRows=sh.rows;
  sh.areas.forEach(function(a,i){
    var cell=cellBuilder(i,a);
    cell.style.gridColumn=a.c;
    cell.style.gridRow=a.r;
    g.appendChild(cell);
  });
  return g;
}
var mdPickerTarget=null;
function mdOpenPicker(rowIdx,cellIdx){
  mdPickerTarget={rowIdx:rowIdx,cellIdx:cellIdx};
  var row=$("mdPickerRow");row.innerHTML="";
  var list=mdAcquiredList();
  if(!list.length){
    var e=document.createElement("div");e.className="mdPickEmpty";e.textContent="아직 획득한 로고 아이콘이 없습니다.";
    row.appendChild(e);
  }else{
    list.forEach(function(m){
      var it=document.createElement("div");it.className="mdPickIt";
      var img=document.createElement("img");img.alt="";img.src=m.path;
      it.appendChild(img);
      it.addEventListener("click",function(){
        if(!mdPickerTarget)return;
        var t=mdPickerTarget;
        cfg.myDesign[t.rowIdx].cells[t.cellIdx]=m.key;
        saveCfg();
        mdClosePicker();
        render();
      });
      row.appendChild(it);
    });
  }
  $("mdPicker").classList.add("on");
  $("mdPickerBackdrop").classList.add("on");
}
function mdClosePicker(){
  mdPickerTarget=null;
  $("mdPicker").classList.remove("on");
  $("mdPickerBackdrop").classList.remove("on");
}
$("mdPickerBackdrop").addEventListener("click",mdClosePicker);

    trash.addEventListener("click",function(e){

function mdAttachSwipe(rowEl,innerEl){
  var startX=0,startY=0,dragging=false,moved=false,wasOpen=false;
  var DEL_W=64;
  innerEl.addEventListener("pointerdown",function(e){
    if(e.pointerType==="mouse"&&e.button!==0)return;
    startX=e.clientX;startY=e.clientY;
    wasOpen=rowEl.classList.contains("swiped");
    dragging=true;moved=false;
    innerEl.style.transition="none";
  });
  innerEl.addEventListener("pointermove",function(e){
    if(!dragging)return;
    var dx=e.clientX-startX,dy=e.clientY-startY;
    if(!moved){
      if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
      if(Math.abs(dy)>Math.abs(dx)){dragging=false;innerEl.style.transition="";return;}
      moved=true;
    }
    var base=wasOpen?-DEL_W:0;
    var nx=Math.min(0,Math.max(-DEL_W,base+dx));
    innerEl.style.transform="translateX("+nx+"px)";
    innerEl._nx=nx;
  });
  function finish(){
    if(!dragging)return;
    dragging=false;
    innerEl.style.transition="";
    if(moved){
      var nx=typeof innerEl._nx==="number"?innerEl._nx:(wasOpen?-DEL_W:0);
      var open=nx<-DEL_W/2;
      rowEl.classList.toggle("swiped",open);
      innerEl.style.transform="";
      innerEl._nx=undefined;
      var blocker=function(ev){ev.stopPropagation();ev.preventDefault();};
      innerEl.addEventListener("click",blocker,{capture:true,once:true});

  arr.sort(function(a,b){

}

function showConfirm(msg,onOk,danger,title,hold){
  $("confirmMsg").textContent=msg;
  $("confirmMsg").classList.toggle("danger",!!danger);
  if(title){$("confirmTitle").textContent=title;$("confirmTitle").hidden=false}else{$("confirmTitle").hidden=true}
  $("confirmOk").classList.toggle("hold",!!hold);
  $("confirmOk").classList.remove("filling");
  $("confirmModal").style.display="flex";
  var holdTimer=null;
  function cleanup(){
    $("confirmModal").style.display="none";
    clearTimeout(holdTimer);
    $("confirmOk").classList.remove("filling");
    $("confirmOk").removeEventListener("click",okHandler);
    $("confirmOk").removeEventListener("pointerdown",startHold);
    $("confirmOk").removeEventListener("pointerup",stopHold);
    $("confirmOk").removeEventListener("pointercancel",stopHold);
    $("confirmCancel").removeEventListener("click",cancelHandler);
  }
  function okHandler(){cleanup();onOk&&onOk()}
  function cancelHandler(){cleanup()}
  function startHold(e){
    try{e.target.setPointerCapture(e.pointerId)}catch(err){}
    e.preventDefault();
    $("confirmOk").classList.add("filling");
    holdTimer=setTimeout(function(){cleanup();onOk&&onOk()},3000);
  }
  function stopHold(){
    clearTimeout(holdTimer);
    $("confirmOk").classList.remove("filling");
  }
  if(hold){
    $("confirmOk").addEventListener("pointerdown",startHold);
    $("confirmOk").addEventListener("pointerup",stopHold);
    $("confirmOk").addEventListener("pointercancel",stopHold);
  }else{
    $("confirmOk").addEventListener("click",okHandler);
  }
  $("confirmCancel").addEventListener("click",cancelHandler);
}

    if(s){

      cfg.gmax=!!c.gmax;cfg.regional=!!c.regional;cfg.mega=!!c.mega;
      cfg.dexIdx=(typeof c.dexIdx==="number"&&c.dexIdx>=0&&c.dexIdx<20)?c.dexIdx:0;
      cfg.fillOrder=(c.fillOrder===1||c.fillOrder===2)?c.fillOrder:0;
      cfg.collapsed=(c.collapsed&&typeof c.collapsed==="object")?c.collapsed:{};
      cfg.mode=(c.mode==="my")?"my":"grid";
      cfg.myDesign=sanitizeMyDesign(c.myDesign);
      cfg.sortOrder=(c.sortOrder===1||c.sortOrder===2)?c.sortOrder:0;
      cfg.gachaAnim=("gachaAnim" in c)?!!c.gachaAnim:true;
      cfg.gachaAlwaysAll=!!c.gachaAlwaysAll;
      selB=new Set(Array.isArray(c.b)?c.b:[]);
      selT=new Set(Array.isArray(c.t)?c.t:[]);
      localStorage.setItem("p30psq2cfg",JSON.stringify(c));
      applyCols();
      updateViewIcon();
    }
    p30ImgFound=Array.isArray(d30.imgFound)?new Set(d30.imgFound):new Set(P30_ALL_IMG_KEYS);
    localStorage.setItem("p30imgfound",JSON.stringify(Array.from(p30ImgFound)));
    p30Favs=Array.isArray(d30.favs)?new Set(d30.favs):new Set();
    localStorage.setItem("p30favs",JSON.stringify(Array.from(p30Favs)));
    coin30=(typeof d.coin30==="number"&&isFinite(d.coin30)&&d.coin30>=0)?Math.floor(d.coin30):0;
    coin30earned=(typeof d.coin30earned==="number"&&isFinite(d.coin30earned)&&d.coin30earned>=0)?Math.floor(d.coin30earned):0;
    cacheCoin30();
    var cfgDirty=false;
    if(cfg.sil&&!stats.sil){cfg.sil=false;document.body.classList.remove("shadow");cfgDirty=true;}
    if(cfg.typ&&!stats.typ){cfg.typ=false;cfgDirty=true;}
    if(cfgDirty){saveCfg();}
    render();
    buildMenu();
    updateAuthUI();
  }).catch(function(e){console.warn("서버 동기화 실패",e);stats=loadStats()});
}

// 하나의 몬스터볼(떨어짐→대기 흔들림→클릭시 응축→하얘짐→로고 공개) 연출 단위.
// wrap/ball/ballWhite/shadow/result/resultWhite: 각 파츠 엘리먼트, dropDelay: 낙하 시작까지의 지연(ms, 여러개를 시차 배치할 때 사용)
function runGachaUnit(wrap,ball,ballWhite,shadow,result,resultWhite,dropDelay){
  var wiggleTimer=null,dropTimer=null,opened=false;
  var wrapBase=wrap.className,shadowBase=shadow.className;
  function setWrapCls(extra){wrap.className=extra?(wrapBase+" "+extra).trim():wrapBase;}
  function setShadowCls(extra){shadow.className=extra?(shadowBase+" "+extra).trim():shadowBase;}
  function revealResult(withFlash){
    var pick=IMG30META[Math.floor(Math.random()*IMG30META.length)];
    result.src=pick.path;
    if(withFlash)resultWhite.src=pick.path;
    // 두 레이어(원본 색상/흰색 실루엣)가 서로 다른 타이밍에 디코딩되면
    // 색이 잠깐 비쳤다가 흰색이 뒤늦게 덮으며 사라지는 것처럼 보일 수 있어,
    // 둘 다 디코딩이 끝난 뒤에만 보여준다.
    var imgs=withFlash?[result,resultWhite]:[result];
    Promise.all(imgs.map(function(im){
      return (im.decode?im.decode():Promise.resolve()).catch(function(){});
    })).then(function(){
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          result.classList.add("reveal");
          if(withFlash){
            resultWhite.classList.add("reveal");
            setTimeout(function(){resultWhite.classList.add("flashoff")},180);
          }
        });
      });
    });
  }
  function scheduleWiggle(){
    wiggleTimer=setTimeout(function(){
      ball.classList.remove("wiggle");
      void ball.offsetWidth;
      ball.classList.add("wiggle");
      scheduleWiggle();
    },2200+Math.random()*2800);
  }
  function openNow(){
    if(opened)return;
    if(wrap.classList.contains("opening")||wrap.classList.contains("condensing"))return;
    opened=true;
    clearTimeout(wiggleTimer);wiggleTimer=null;
    if(!wrap.classList.contains("settled"))setWrapCls("settled");
    wrap.classList.add("condensing");
    ball.classList.remove("wiggle");
    ball.classList.add("condense");
    ballWhite.classList.add("condense");
    shadow.classList.add("condense");
    setTimeout(function(){
      wrap.classList.add("closing");
      shadow.classList.add("fadeout");
      setTimeout(function(){
        wrap.classList.add("opening");
        revealResult(true);
      },650);
    },280);
  }
  if(!cfg.gachaAnim){
    // 애니메이션 끄기: 연출 없이 바로 결과 공개(흰색 반짝임도 생략)
    opened=true;
    setWrapCls("settled opening");
    setShadowCls("");
    wrap.onclick=null;
    revealResult(false);
    return{open:function(){},destroy:function(){}};
  }
  dropTimer=setTimeout(function(){
    setWrapCls("drop");
    setShadowCls("");
    void shadow.offsetWidth;
    setShadowCls("grow");
    wrap.addEventListener("animationend",function onDrop(){
      wrap.removeEventListener("animationend",onDrop);
      setWrapCls("settled");
    },{once:true});
    scheduleWiggle();
  },dropDelay||0);
  wrap.onclick=openNow;
  return{
    open:openNow,
    destroy:function(){clearTimeout(wiggleTimer);clearTimeout(dropTimer)}
  };
}
function startGachaOne(){
  // TODO: 실제 코인 차감(spendCoin30)/뽑기 확률/보유 로고 반영은 추후 연결. 지금은 연출만 구현.
  $("gachaDesc").style.display="none";
  $("gachaAll").style.display="none";
  $("gachaOne").style.display="none";
  $("gachaStage").style.display="block";
  gachaOneUnit=runGachaUnit($("gachaBallWrap"),$("gachaBall"),$("gachaBallWhite"),$("gachaShadow"),$("gachaResult"),$("gachaResultWhite"),0);
}
function startGachaAll(){
  // TODO: 실제 코인 차감/뽑기 확률/보유 로고 반영은 추후 연결. 지금은 연출만 구현(현재 코인 수만큼 몬스터볼 표시).
  var n=Math.max(0,Math.floor(coin30||0));
  $("gachaDesc").style.display="none";
  $("gachaAll").style.display="none";
  $("gachaOne").style.display="none";
  $("gachaCancel").style.display="none";
  var grid=$("gachaGrid");
  grid.innerHTML="";
  gachaGridUnits=[];
  for(var i=0;i<n;i++){
    var stage=document.createElement("div");stage.className="gStage";
    var shadow=document.createElement("div");shadow.className="gShadow";
    var wrap=document.createElement("div");wrap.className="gBallWrap";
    var ball=document.createElement("img");ball.className="gBall";ball.src="monsterball.png";ball.alt="뽑기";
    var ballWhite=document.createElement("img");ballWhite.className="gBallWhite";ballWhite.src="monsterball.png";ballWhite.alt="";
    var result=document.createElement("img");result.className="gResult";result.alt="";
    var resultWhite=document.createElement("img");resultWhite.className="gResultWhite";resultWhite.alt="";
    wrap.appendChild(ball);wrap.appendChild(ballWhite);
    stage.appendChild(shadow);stage.appendChild(wrap);stage.appendChild(result);stage.appendChild(resultWhite);
    grid.appendChild(stage);
    var delay=Math.floor(i/3)*160+Math.random()*90;
    gachaGridUnits.push(runGachaUnit(wrap,ball,ballWhite,shadow,result,resultWhite,delay));
  }
  grid.style.display=n?"grid":"none";
  $("gachaOpenAll").style.display="";
  $("gachaGridClose").style.display="";
}

function buildTypeRow(){
  var tr=$("typerow");
  if(!tr.children.length){
    TYPES.forEach(function(t,ti){
      var im=document.createElement("img");im.className="tic";im.src=TYPEICON[ti];im.alt=t[1];
      tr.appendChild(im);
    });
  }
  var kids=tr.children;
  for(var i=0;i<kids.length;i++)kids[i].classList.toggle("on",selT.size===0||selT.has(i));
}
function buildMenu(){
  buildTypeRow();
  var bc=$("boxchips");bc.innerHTML="";
  chip("전체",selB.size===0,function(){selB.clear();saveCfg();render();buildMenu()},bc);
  BOXES30.forEach(function(b,bi){
    if(!IMG30META.some(function(m){return m.box===bi}))return;
    chip(b[1],selB.has(bi),function(){
      if(selB.has(bi))selB.delete(bi);else selB.add(bi);
      saveCfg();render();buildMenu();
    },bc);
  });
  var soc=$("sortchips");soc.innerHTML="";
  [[0,"번호순"],[1,"획득순(↑)"],[2,"획득순(↓)"]].forEach(function(o){
    chip(o[1],cfg.sortOrder===o[0],function(){cfg.sortOrder=o[0];saveCfg();render();buildMenu()},soc);
  });
  var gac=$("gachaAnimChips");gac.innerHTML="";
  [[true,"켜기"],[false,"끄기"]].forEach(function(o){
    chip(o[1],cfg.gachaAnim===o[0],function(){cfg.gachaAnim=o[0];saveCfg();buildMenu()},gac);
  });
  var gaoc=$("gachaAllOnlyChips");gaoc.innerHTML="";
  [[false,"끄기"],[true,"켜기"]].forEach(function(o){
    chip(o[1],cfg.gachaAlwaysAll===o[0],function(){cfg.gachaAlwaysAll=o[0];saveCfg();buildMenu()},gaoc);
  });
}
